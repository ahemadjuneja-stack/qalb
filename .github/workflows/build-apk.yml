name: Build & Release Qalb APK

# ═══════════════════════════════════════════════════════════════════
#  Qalb CI/CD — "Push to main = naya APK + in-app update"
#
#  Flow:
#    git push origin main
#      → Next.js static export (out/)
#      → Capacitor Android sync
#      → Signed release APK (keystore Firestore ci_private/keystore se)
#      → GitHub Release (APK yahin host hoti hai — repo public)
#      → Firestore appVersions/latest publish (apkUrl = GitHub Release link)
#      → Installed apps ko Profile > Check par naya version dikhega
#
#  DESIGN NOTES:
#    • GCS bucket KAHIN use nahi hota (billing 403 issue) — sab GitHub
#      Release + Firestore pe. Zero extra kharcha.
#    • Keystore Firestore ke PRIVATE doc `ci_private/keystore` me base64
#      me hoti hai (security rules se fully blocked — sirf service account).
#      Chhoti file hai (~5KB), 1MiB doc limit se door door tak nahi.
#    • Firebase project id service account JSON se auto-detect hota hai
#    • versionCode = github.run_number (har push pe +1)
#    • Audio/images jaisi badi files KABHI Firestore me nahi — storage pe
#      rakh ke Firestore me sirf URL.
#
#  SIRF 1 SECRET CHAHIYE:
#    GCP_SERVICE_ACCOUNT_JSON = Firebase service account ka JSON (raw paste)
# ═══════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: qalb-apk-release
  cancel-in-progress: false

env:
  NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE_URL }}
  # Auth (login) ke liye — GitHub repo Variables me set karein (optional):
  #   FIREBASE_WEB_API_KEY  → Firebase console > Project settings > Web API key
  #   GOOGLE_CLIENT_ID      → OAuth 2.0 Web Client ID (Google login ke liye)
  # Agar variables empty hain to app Firestore config/auth doc se leta hai.
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # GitHub Release create + commit notes read karne ke liye
    permissions:
      contents: write
    steps:
      # ── 1. Checkout + environment ─────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # Capacitor CLI ko Node >= 22 chahiye
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 ke liye JDK 21 ZAROORI hai (library VERSION_21 target karti hai)
      - name: Setup Java 21 (Android build + keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Capacitor + Android platform
        run: npm i -D @capacitor/cli@latest && npm i @capacitor/android@latest @capacitor/filesystem@latest

      # ── 2. Versioning ─────────────────────────────────────────────
      # versionName = package.json ka "version"
      # versionCode = github.run_number (har push pe automatic +1)
      - name: Resolve version (versionName + auto versionCode)
        id: ver
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Qalb build v$VERSION_NAME (code $VERSION_CODE)"

      # app ka JS updater inhi numbers se compare karta hai
      - name: Generate src/lib/app-build.ts
        run: |
          cat > src/lib/app-build.ts <<EOF
          // AUTO-GENERATED by GitHub Actions — commit mat karna (local default raheta hai)
          export const APP_BUILD = {
            versionCode: ${{ steps.ver.outputs.versionCode }},
            versionName: '${{ steps.ver.outputs.versionName }}',
          } as const
          EOF

      # ── 3. GCP auth — SIRF Firestore (version publish + keystore doc) ──
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve Firebase project id
        run: |
          FPID=$(echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' | jq -r .project_id)
          if [ -z "$FPID" ] || [ "$FPID" = "null" ]; then
            echo "❌ GCP_SERVICE_ACCOUNT_JSON secret me project_id nahi mila — secret dobara check karo"
            exit 1
          fi
          echo "FPID=$FPID" >> "$GITHUB_ENV"
          echo "Firebase project: $FPID"

      # ── 4. Web build (static export for Capacitor) ────────────────
      - name: Build Next.js static export
        run: |
          # Mobile build me server API routes nahi hote — APK Firestore REST
          # + hosted API (NEXT_PUBLIC_API_BASE) use karta hai. Isliye api/
          # folder temporarily hata ke export lete hain.
          # YT_API_KEY (GitHub secret, optional) → APK me direct YouTube search
          mv src/app/api .api-routes-backup
          MOBILE_BUILD=1 NEXT_PUBLIC_FIREBASE_PROJECT_ID="$FPID" NEXT_PUBLIC_API_BASE="${{ vars.API_BASE_URL }}" NEXT_PUBLIC_YOUTUBE_API_KEY="${{ secrets.YT_API_KEY }}" npx next build

      # ── 5. Capacitor Android project ──────────────────────────────
      - name: Capacitor sync
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap copy android
          npx cap sync android

      # ── 6. Signing (keystore Firestore ci_private/keystore me) ────
      # Pehli build: keytool se keystore banti hai → base64 → Firestore private doc
      # Baaki builds: wahi doc se wapas → same signature → updates install honge
      # NOTE: ye doc security rules me fully blocked hai (ci_private) —
      #       sirf service account (admin) padh/sakta hai.
      - name: Signing setup (keystore Firestore se)
        run: |
          mkdir -p android/app
          KS="android/app/qalb-upload.keystore"
          FSTORE="https://firestore.googleapis.com/v1/projects/${FPID}/databases/(default)/documents"
          TOKEN=$(gcloud auth print-access-token)

          DOC=$(curl -sS -H "Authorization: Bearer $TOKEN" "${FSTORE}/ci_private/keystore")
          B64=$(echo "$DOC" | jq -r '.fields.keystoreBase64.stringValue // empty')

          if [ -n "$B64" ]; then
            echo "Signing: purani keystore Firestore se mili (same signature — updates install honge)"
            echo "$B64" | base64 -d > "$KS"
          else
            echo "Signing: pehli build — nayi keystore generate ho rahi hai..."
            keytool -genkeypair -v \
              -keystore "$KS" \
              -alias qalb \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storetype PKCS12 \
              -storepass qalb-auto-store-2026 \
              -keypass qalb-auto-store-2026 \
              -dname "CN=Qalb App, OU=Qalb, O=Qalb, L=Karachi, C=PK"
            echo "Signing: keystore Firestore ci_private/keystore me save ho rahi hai..."
            jq -n --arg b64 "$(base64 -w0 "$KS")" \
              '{fields: {
                 keystoreBase64: {stringValue: $b64},
                 storePassword:  {stringValue: "qalb-auto-store-2026"},
                 keyPassword:    {stringValue: "qalb-auto-store-2026"},
                 keyAlias:       {stringValue: "qalb"},
                 updatedAt:      {timestampValue: (now | todateiso8601)}
               }}' > /tmp/ks-doc.json
            HTTP=$(curl -sS -o /tmp/ks-resp.json -w '%{http_code}' -X PATCH \
              "${FSTORE}/ci_private/keystore" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d @/tmp/ks-doc.json)
            if [ "$HTTP" != "200" ]; then
              echo "❌ Keystore Firestore me save NAHI hui (HTTP $HTTP):"
              head -c 500 /tmp/ks-resp.json
              exit 1
            fi
            echo "Signing: keystore backup done (private doc, rules se blocked)"
          fi

          cat > android/key.properties <<EOF
          storeFile=qalb-upload.keystore
          storePassword=qalb-auto-store-2026
          keyAlias=qalb
          keyPassword=qalb-auto-store-2026
          EOF

      - name: Inject signing config into build.gradle
        run: python3 scripts/patch-android-signing.py

      - name: Set Android versionCode / versionName
        run: |
          BGRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.ver.outputs.versionCode }}/" "$BGRADLE"
          sed -i "s/versionName \".*\"/versionName \"${{ steps.ver.outputs.versionName }}\"/" "$BGRADLE"

      # ── 7. Signed APK build ───────────────────────────────────────
      - name: Gradle assembleRelease
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/qalb-v${{ steps.ver.outputs.versionName }}.apk"
          ls -la dist/

      # ── 8. GitHub Release (APK hosting — repo public, direct download) ──
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.versionName }}-${{ github.run_number }}"
          gh release create "$TAG" \
            --latest \
            --title "Qalb v${{ steps.ver.outputs.versionName }} (code ${{ github.run_number }})" \
            --notes "APK build from commit ${{ github.sha }}" \
            "dist/qalb-v${{ steps.ver.outputs.versionName }}.apk" \
            || gh release upload "$TAG" "dist/qalb-v${{ steps.ver.outputs.versionName }}.apk" --clobber
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/qalb-v${{ steps.ver.outputs.versionName }}.apk"
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"
          echo "APK download link: $APK_URL"

      # ── 9. Publish version to Firestore (appVersions/latest) ──────
      # App isi doc ko poll karta hai — versionCode bara ho to update prompt.
      # Release BANNE KE BAAD publish hota hai — apkUrl kabhi dead nahi hoga.
      - name: Publish to Firestore appVersions/latest
        run: |
          TOKEN=$(gcloud auth print-access-token)
          DOC_URL="https://firestore.googleapis.com/v1/projects/${FPID}/databases/(default)/documents/appVersions/latest"
          RELEASE_NOTES=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }} --jq '.commit.message' | head -1 | cut -c1-500)
          curl -sS -X PATCH "$DOC_URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"fields\": {
                \"versionCode\": {\"integerValue\": \"${{ steps.ver.outputs.versionCode }}\"},
                \"versionName\": {\"stringValue\": \"${{ steps.ver.outputs.versionName }}\"},
                \"apkUrl\":      {\"stringValue\": \"${APK_URL}\"},
                \"releaseNotes\": {\"stringValue\": $(printf '%s' "$RELEASE_NOTES" | jq -Rs .)},
                \"mandatory\":   {\"booleanValue\": false},
                \"publishedAt\": {\"timestampValue\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}
              }
            }" | jq -e '.fields.versionCode.integerValue' >/dev/null \
            && echo "Firestore updated: v${{ steps.ver.outputs.versionName }} (code ${{ steps.ver.outputs.versionCode }})"
        env:
          GH_TOKEN: ${{ github.token }}
