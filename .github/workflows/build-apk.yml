name: Build & Release Qalb APK

# ═══════════════════════════════════════════════════════════════════
#  Qalb CI/CD — "Push to main = naya APK + in-app update"
#
#  Flow:
#    git push origin main
#      → Next.js static export (out/)
#      → Capacitor Android sync
#      → Signed release APK (keystore Firestore ci_private/keystore se)
#      → GitHub Release (APK yahin host hoti hai — repo public)
#      → Firestore appVersions/latest publish (apkUrl = GitHub Release link)
#      → Installed apps ko Profile > Check par naya version dikhega
#
#  DESIGN NOTES:
#    • GCS bucket KAHIN use nahi hota (billing 403 issue) — sab GitHub
#      Release + Firestore pe. Zero extra kharcha.
#    • Keystore Firestore ke PRIVATE doc `ci_private/keystore` me base64
#      me hoti hai (security rules se fully blocked — sirf service account).
#      Chhoti file hai (~5KB), 1MiB doc limit se door door tak nahi.
#    • Firebase project id service account JSON se auto-detect hota hai
#    • versionCode = github.run_number (har push pe +1)
#    • Audio/images jaisi badi files KABHI Firestore me nahi — storage pe
#      rakh ke Firestore me sirf URL.
#
#  SIRF 1 SECRET CHAHIYE:
#    GCP_SERVICE_ACCOUNT_JSON = Firebase service account ka JSON (raw paste)
# ═══════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: qalb-apk-release
  cancel-in-progress: false

env:
  NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE_URL }}
  # Auth (login) ke liye — GitHub repo Variables me set karein (optional):
  #   FIREBASE_WEB_API_KEY  → Firebase console > Project settings > Web API key
  #   GOOGLE_CLIENT_ID      → OAuth 2.0 Web Client ID (Google login ke liye)
  # Agar variable khaali hai to "Resolve login config" step service account se
  # Web API key AUTO-discover karta hai (webApps → webConfig). Isliye ye env
  # workflow-level par NAHI — build step ke env me hai (warna khaali string
  # discovered key ko override kar deti).

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # GitHub Release create + commit notes read karne ke liye
    permissions:
      contents: write
    steps:
      # ── 1. Checkout + environment ─────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # webMinNative heuristic pichli release ke commit se diff karta
          # hai — full history chahiye
          fetch-depth: 0

      # Capacitor CLI ko Node >= 22 chahiye
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 ke liye JDK 21 ZAROORI hai (library VERSION_21 target karti hai)
      - name: Setup Java 21 (Android build + keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Capacitor + Android platform
        run: npm i -D @capacitor/cli@latest && npm i @capacitor/android@latest @capacitor/filesystem@latest

      # ── 2. Versioning ─────────────────────────────────────────────
      # versionName = package.json ka "version"
      # versionCode = github.run_number (har push pe automatic +1)
      - name: Resolve version (versionName + auto versionCode)
        id: ver
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Qalb build v$VERSION_NAME (code $VERSION_CODE)"

      # app ka JS updater inhi numbers se compare karta hai
      - name: Generate src/lib/app-build.ts
        run: |
          cat > src/lib/app-build.ts <<EOF
          // AUTO-GENERATED by GitHub Actions — commit mat karna (local default raheta hai)
          export const APP_BUILD = {
            versionCode: ${{ steps.ver.outputs.versionCode }},
            versionName: '${{ steps.ver.outputs.versionName }}',
          } as const
          EOF

      # ── 3. GCP auth — SIRF Firestore (version publish + keystore doc) ──
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve Firebase project id
        run: |
          FPID=$(echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' | jq -r .project_id)
          if [ -z "$FPID" ] || [ "$FPID" = "null" ]; then
            echo "❌ GCP_SERVICE_ACCOUNT_JSON secret me project_id nahi mila — secret dobara check karo"
            exit 1
          fi
          echo "FPID=$FPID" >> "$GITHUB_ENV"
          echo "Firebase project: $FPID"

      # ── 3b. Login config (v0.4.1 FIX — "Login nahi ho rahaa") ─────
      # v0.4.0 build me NEXT_PUBLIC_FIREBASE_API_KEY khaali thi (GitHub
      # variable set nahi tha) → har login attempt 'auth-setup' error.
      # FIX: agar GitHub variable FIREBASE_WEB_API_KEY set hai to wahi
      # use hota hai; warna service account se Firebase project ki web
      # app ka webConfig fetch kar ke API key AUTO-discover hoti hai.
      # (Web API key public identifier hai — APK me bake kana standard
      #  Firebase practice hai, secret NAHI.)
      - name: Resolve login config (Web API key auto-discover)
        id: authcfg
        run: |
          KEY="${{ vars.FIREBASE_WEB_API_KEY }}"
          SRC="github-variable"
          if [ -z "$KEY" ]; then
            SRC="auto-discover"
            TOKEN=$(gcloud auth print-access-token 2>/dev/null || true)
            if [ -n "$TOKEN" ]; then
              # NOTE: har network/jq call failure-proof — ek kharab response
              # poora build nahi girayega (run 55 me jq parse error se fail
              # hua tha). Bad response → key khaali → warning, build chalega.
              # Path 1: Firebase web app → webConfig (official route)
              # (http status/content_type log karte hain — body NAHI, usme
              #  masked secrets aa sakte hain; run 55/56 me non-JSON response
              #  aa raha tha, is se root cause dikhega)
              WA=$(curl -sS -m 20 --retry 2 -w '\n|%{http_code}|%{content_type}' -H "Authorization: Bearer $TOKEN" \
                "https://firebase.googleapis.com/v1beta1/projects/${FPID}/webApps" 2>/dev/null || true)
              echo "webApps meta: $(printf '%s' "$WA" | tail -1) bodyLen=$(printf '%s' "$WA" | head -n -1 2>/dev/null | wc -c)"
              APPID=$(printf '%s' "$WA" | head -n -1 2>/dev/null | jq -r '.apps[0].appId // empty' 2>/dev/null || true)
              # Path 1b: web app hi nahi hai (ROOT CAUSE — project me kabhi
              # web app register nahi hua, isliye Web API key exist hi nahi
              # karti). One-time: 'Qalb Web' app khud bana do — console me
              # Project settings > General > Your apps > Web app add karne
              # ke barabar. Idempotent — agla run list se mil jayega.
              if [ -z "$APPID" ]; then
                echo "web app nahi mila — one-time 'Qalb Web' app create kar rahe hain..."
                CREATE=$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" -d '{"displayName": "Qalb Web"}' \
                  "https://firebase.googleapis.com/v1beta1/projects/${FPID}/webApps" 2>/dev/null || true)
                OP=$(printf '%s' "$CREATE" | jq -r '.name // empty' 2>/dev/null || true)
                if [ -n "$OP" ]; then
                  for i in $(seq 1 20); do
                    if printf '%s' "$CREATE" | jq -e '.done == true' >/dev/null 2>&1; then break; fi
                    sleep 3
                    CREATE=$(curl -sS -m 20 -H "Authorization: Bearer $TOKEN" \
                      "https://firebase.googleapis.com/v1/${OP}" 2>/dev/null || true)
                  done
                  echo "create op: done=$(printf '%s' "$CREATE" | jq -r '.done // false' 2>/dev/null || echo '?') err=$(printf '%s' "$CREATE" | jq -r '.error.message // null' 2>/dev/null || echo '?')"
                else
                  echo "create call ka koi operation nahi louta: $(printf '%s' "$CREATE" | jq -r '.error.message // "unknown"' 2>/dev/null || echo 'non-json')"
                fi
                WA=$(curl -sS -m 20 --retry 2 -H "Authorization: Bearer $TOKEN" \
                  "https://firebase.googleapis.com/v1beta1/projects/${FPID}/webApps" 2>/dev/null || true)
                APPID=$(printf '%s' "$WA" | jq -r '.apps[0].appId // empty' 2>/dev/null || true)
                echo "web app ab: appId=${APPID:-FAIL}"
              fi
              # Identity Toolkit API (OTP REST isi se chalta hai) — enable/
              # confirm, best-effort
              if gcloud services enable identitytoolkit.googleapis.com --project="$FPID" >/dev/null 2>&1; then
                echo "identitytoolkit API: enabled/confirmed"
              else
                echo "identitytoolkit API enable FAIL — console se enable karna hoga"
              fi
              if [ -n "$APPID" ]; then
                WC=$(curl -sS -m 20 --retry 2 -H "Authorization: Bearer $TOKEN" \
                  "https://firebase.googleapis.com/v1alpha/projects/-/apps/${APPID}/webConfig" 2>/dev/null || true)
                KEY=$(printf '%s' "$WC" | jq -r '.apiKey // empty' 2>/dev/null || true)
                [ -n "$KEY" ] && SRC="webConfig(${APPID})"
              fi
              # Path 2 fallback: GCP API Keys manager — gcloud native (auth/
              # transport isi khud handle karta hai — raw curl se zyada bharosemand).
              # Firebase projects me "Web key (auto created by Google Firebase
              # service)" hota hi hai. keyString LOG NAHI karte.
              if [ -z "$KEY" ]; then
                KL=$(gcloud services api-keys list --project="$FPID" --format=json 2>/dev/null || true)
                echo "apikeys(gcloud): $(printf '%s' "$KL" | jq -c '[.[] | {name: (.name // null | split("/")[-1]), displayName: (.displayName // null)}]' 2>/dev/null || echo 'parse-fail')"
                KNAME=$(printf '%s' "$KL" | jq -r '[.[] | select((.displayName // "") | test("Web key"; "i"))][0].name // empty' 2>/dev/null || true)
                if [ -n "$KNAME" ]; then
                  KEY=$(gcloud services api-keys describe "$KNAME" --project="$FPID" --format='value(keyString)' 2>/dev/null || true)
                  [ -n "$KEY" ] && SRC="apikeys-web-key"
                else
                  KNAME=$(printf '%s' "$KL" | jq -r '[.[] | select((.restrictions.androidKeyRestrictions.androidApplications // []) == [] and ((.restrictions.iosKeyRestrictions.iosApplications // []) == []))][0].name // empty' 2>/dev/null || true)
                  if [ -n "$KNAME" ]; then
                    KEY=$(gcloud services api-keys describe "$KNAME" --project="$FPID" --format='value(keyString)' 2>/dev/null || true)
                    [ -n "$KEY" ] && SRC="apikeys-unrestricted"
                  fi
                fi
              fi
            else
              echo "gcloud token nahi mila — service account auth fail?"
            fi
          fi
          echo "apiKey=$KEY" >> "$GITHUB_OUTPUT"
          echo "login config: source=${SRC} apiKeyLen=${#KEY}"
          if [ -z "$KEY" ]; then
            echo "⚠️ Web API key nahi mili — app me login guest-mode tak simat jayega."
            echo "   FIX: GitHub Variables me FIREBASE_WEB_API_KEY daalo (Firebase console > Project settings > General > Web API Key)"
          fi

      # ── 4. Web build (static export for Capacitor) ────────────────
      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ steps.authcfg.outputs.apiKey }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          # Mobile build me server API routes nahi hote — APK Firestore REST
          # + hosted API (NEXT_PUBLIC_API_BASE) use karta hai. Isliye api/
          # folder temporarily hata ke export lete hain.
          # YT_API_KEY (GitHub secret, optional) → APK me direct YouTube search
          mv src/app/api .api-routes-backup
          MOBILE_BUILD=1 NEXT_PUBLIC_FIREBASE_PROJECT_ID="$FPID" NEXT_PUBLIC_API_BASE="${{ vars.API_BASE_URL }}" NEXT_PUBLIC_YOUTUBE_API_KEY="${{ secrets.YT_API_KEY }}" npx next build
          # sanity: DISCOVERED key really bake hui? (bundle me InnerTube ke
          # AIzaSy keys pehle se hote hain — isliye full discovered key hi
          # grep karte hain, warna false-positive milta tha — run 56)
          BKEY="${{ steps.authcfg.outputs.apiKey }}"
          if [ -n "$BKEY" ] && grep -rqF "$BKEY" out/_next/static --include='*.js' 2>/dev/null; then
            echo "✅ Discovered Firebase Web API key bundle me baked hai"
          else
            echo "⚠️ Discovered key bundle me NAHI mili (keyLen=${#BKEY}) — login setup adhoora rahega"
          fi

      # ── 5. Capacitor Android project ──────────────────────────────
      - name: Capacitor sync
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap copy android
          npx cap sync android

      # ── 6. Signing (keystore Firestore ci_private/keystore me) ────
      # Pehli build: keytool se keystore banti hai → base64 → Firestore private doc
      # Baaki builds: wahi doc se wapas → same signature → updates install honge
      # NOTE: ye doc security rules me fully blocked hai (ci_private) —
      #       sirf service account (admin) padh/sakta hai.
      - name: Signing setup (keystore Firestore se)
        run: |
          mkdir -p android/app
          KS="android/app/qalb-upload.keystore"
          FSTORE="https://firestore.googleapis.com/v1/projects/${FPID}/databases/(default)/documents"
          TOKEN=$(gcloud auth print-access-token)

          DOC=$(curl -sS -H "Authorization: Bearer $TOKEN" "${FSTORE}/ci_private/keystore")
          B64=$(echo "$DOC" | jq -r '.fields.keystoreBase64.stringValue // empty')

          if [ -n "$B64" ]; then
            echo "Signing: purani keystore Firestore se mili (same signature — updates install honge)"
            echo "$B64" | base64 -d > "$KS"
          else
            echo "Signing: pehli build — nayi keystore generate ho rahi hai..."
            keytool -genkeypair -v \
              -keystore "$KS" \
              -alias qalb \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storetype PKCS12 \
              -storepass qalb-auto-store-2026 \
              -keypass qalb-auto-store-2026 \
              -dname "CN=Qalb App, OU=Qalb, O=Qalb, L=Karachi, C=PK"
            echo "Signing: keystore Firestore ci_private/keystore me save ho rahi hai..."
            jq -n --arg b64 "$(base64 -w0 "$KS")" \
              '{fields: {
                 keystoreBase64: {stringValue: $b64},
                 storePassword:  {stringValue: "qalb-auto-store-2026"},
                 keyPassword:    {stringValue: "qalb-auto-store-2026"},
                 keyAlias:       {stringValue: "qalb"},
                 updatedAt:      {timestampValue: (now | todateiso8601)}
               }}' > /tmp/ks-doc.json
            HTTP=$(curl -sS -o /tmp/ks-resp.json -w '%{http_code}' -X PATCH \
              "${FSTORE}/ci_private/keystore" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d @/tmp/ks-doc.json)
            if [ "$HTTP" != "200" ]; then
              echo "❌ Keystore Firestore me save NAHI hui (HTTP $HTTP):"
              head -c 500 /tmp/ks-resp.json
              exit 1
            fi
            echo "Signing: keystore backup done (private doc, rules se blocked)"
          fi

          cat > android/key.properties <<EOF
          storeFile=qalb-upload.keystore
          storePassword=qalb-auto-store-2026
          keyAlias=qalb
          keyPassword=qalb-auto-store-2026
          EOF

      - name: Inject signing config into build.gradle
        run: python3 scripts/patch-android-signing.py

      - name: Set Android versionCode / versionName
        run: |
          BGRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.ver.outputs.versionCode }}/" "$BGRADLE"
          sed -i "s/versionName \".*\"/versionName \"${{ steps.ver.outputs.versionName }}\"/" "$BGRADLE"

      # ── 7. Signed APK build ───────────────────────────────────────
      - name: Gradle assembleRelease
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/qalb-v${{ steps.ver.outputs.versionName }}.apk"
          ls -la dist/

      # ── 7b. Web bundle (OTA live update, v0.3.0) ────────────────
      # Static export (out/) zip → Release asset. Ye bundle webCode =
      # run_number ke sath Firestore doc me publish hota hai; app me
      # chote web fixes APK install kiye bina, restart par khud lagte hain.
      - name: Package web bundle (OTA)
        run: |
          cd out
          zip -qr ../dist/webbundle.zip .
          cd ..
          WEB_SHA=$(sha256sum dist/webbundle.zip | cut -d' ' -f1)
          echo "WEB_SHA=$WEB_SHA" >> "$GITHUB_ENV"
          ls -la dist/
          echo "webbundle.zip sha256: $WEB_SHA"

      # ── 8. GitHub Release (APK hosting — repo public, direct download) ──
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.versionName }}-${{ github.run_number }}"
          gh release create "$TAG" \
            --latest \
            --title "Qalb v${{ steps.ver.outputs.versionName }} (code ${{ github.run_number }})" \
            --notes "APK build from commit ${{ github.sha }}" \
            "dist/qalb-v${{ steps.ver.outputs.versionName }}.apk" \
            "dist/webbundle.zip" \
            || gh release upload "$TAG" "dist/qalb-v${{ steps.ver.outputs.versionName }}.apk" "dist/webbundle.zip" --clobber
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/qalb-v${{ steps.ver.outputs.versionName }}.apk"
          WEB_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/webbundle.zip"
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"
          echo "WEB_URL=$WEB_URL" >> "$GITHUB_ENV"
          echo "APK download link: $APK_URL"
          echo "Web bundle link: $WEB_URL"

      # ── 8b. webMinNative — OTA compatibility gate ────────────────
      # Web bundle SIRF unhi APKs par lagega jo is build ke native code ke
      # sath compatible hain.
      #
      # v0.3.4 FIX: pichli PUBLISHED release ke commit se diff karte hain.
      # (Pehle github.event.before use hota tha — re-run/empty-commit par
      # wo diff khaali deta hai aur purana gate inherit ho jata tha:
      # v0.3.3 me is bug se OTA chal gaya aur APK prompt kabhi nahi dikha.)
      - name: Resolve webMinNative (OTA gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MINNATIVE=""
          # NOTE: is run ka release (step 8) ABHI create hua hai — usko skip
          # karo, warna LAST_SHA = current commit ho jayega (diff khaali →
          # galat inherit). Pichli release chahiye.
          CUR_TAG="v${{ steps.ver.outputs.versionName }}-${{ github.run_number }}"
          LAST_TAG=$(gh release list --repo "${{ github.repository }}" --limit 10 --json tagName -q '.[].tagName' 2>/dev/null \
            | grep -vx "$CUR_TAG" | head -1 || true)
          if [ -n "$LAST_TAG" ]; then
            LAST_SHA=$(gh release view "$LAST_TAG" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null \
              | grep -o 'commit [0-9a-f]\{40\}' | awk '{print $2}' | head -1 || true)
          fi
          if [ -n "$LAST_SHA" ] && git cat-file -e "$LAST_SHA" 2>/dev/null; then
            # v0.3.6 FIX: package.json/lock ka sirf "version" line change
            # har release me hota hai — wo NATIVE change NAHI hai. Pehle
            # ye bhi gate ON kar detа tha → pure-web releases ka OTA purane
            # APKs par kabhi pahunchta hi nahi tha. Ab gate sirf tab ON:
            # android/ + capacitor.config.json change, YA package files me
            # version ke siwa koi ASLI change (naya plugin/deps).
            CHANGED=$(git diff --name-only "$LAST_SHA" "${{ github.sha }}" \
              -- android/ capacitor.config.json | head -1 || true)
            for PKG in package.json package-lock.json; do
              if git diff --name-only "$LAST_SHA" "${{ github.sha }}" -- "$PKG" | grep -q .; then
                NONVER=$(git diff "$LAST_SHA" "${{ github.sha }}" -- "$PKG" \
                  | grep -E '^[+-]' | grep -vE '^[+-]{3}' \
                  | grep -vE '^[+-][[:space:]]*"version"[[:space:]]*:' | head -1 || true)
                if [ -n "$NONVER" ]; then CHANGED="$PKG"; break; fi
              fi
            done
            [ -n "$CHANGED" ] && MINNATIVE="${{ steps.ver.outputs.versionCode }}"
            echo "gate check: $LAST_TAG ($LAST_SHA)..HEAD changed=[${CHANGED:-nothing}]"
          else
            # pichli release ka commit nahi mila — SAFE default: APK hi update raasta
            MINNATIVE="${{ steps.ver.outputs.versionCode }}"
          fi
          if [ -z "$MINNATIVE" ]; then
            TOKEN=$(gcloud auth print-access-token)
            DOC_URL="https://firestore.googleapis.com/v1/projects/${FPID}/databases/(default)/documents/appVersions/latest"
            PREV=$(curl -sS -H "Authorization: Bearer $TOKEN" "$DOC_URL" \
              | jq -r '.fields.webMinNative.integerValue // empty')
            if [ -n "$PREV" ]; then MINNATIVE="$PREV"; else MINNATIVE="${{ steps.ver.outputs.versionCode }}"; fi
          fi
          echo "WEB_MIN_NATIVE=$MINNATIVE" >> "$GITHUB_ENV"
          echo "webMinNative gate: $MINNATIVE (base: ${LAST_SHA:-none})"

      # ── 9. Publish version to Firestore (appVersions/latest) ──────
      # App isi doc ko poll karta hai — versionCode bara ho to update prompt,
      # webCode bara ho (aur APK compatible ho) to silent OTA download.
      # Release BANNE KE BAAD publish hota hai — apkUrl kabhi dead nahi hoga.
      - name: Publish to Firestore appVersions/latest
        run: |
          TOKEN=$(gcloud auth print-access-token)
          DOC_URL="https://firestore.googleapis.com/v1/projects/${FPID}/databases/(default)/documents/appVersions/latest"
          RELEASE_NOTES=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }} --jq '.commit.message' | head -1 | cut -c1-500)
          # [mandatory] commit message me ho to popup dismiss NAHI hota —
          # bade native fixes wali release ke liye
          if echo "$RELEASE_NOTES" | grep -qi '\[mandatory\]'; then MANDATORY=true; else MANDATORY=false; fi
          echo "mandatory: $MANDATORY"
          curl -sS -X PATCH "$DOC_URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"fields\": {
                \"versionCode\": {\"integerValue\": \"${{ steps.ver.outputs.versionCode }}\"},
                \"versionName\": {\"stringValue\": \"${{ steps.ver.outputs.versionName }}\"},
                \"apkUrl\":      {\"stringValue\": \"${APK_URL}\"},
                \"releaseNotes\": {\"stringValue\": $(printf '%s' "$RELEASE_NOTES" | jq -Rs .)},
                \"mandatory\":   {\"booleanValue\": ${MANDATORY}},
                \"webCode\":      {\"integerValue\": \"${{ steps.ver.outputs.versionCode }}\"},
                \"webUrl\":       {\"stringValue\": \"${WEB_URL}\"},
                \"webSha256\":    {\"stringValue\": \"${WEB_SHA}\"},
                \"webMinNative\": {\"integerValue\": \"${WEB_MIN_NATIVE}\"},
                \"publishedAt\": {\"timestampValue\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}
              }
            }" | jq -e '.fields.versionCode.integerValue' >/dev/null \
            && echo "Firestore updated: v${{ steps.ver.outputs.versionName }} (code ${{ steps.ver.outputs.versionCode }}, mandatory=$MANDATORY)"
        env:
          GH_TOKEN: ${{ github.token }}
