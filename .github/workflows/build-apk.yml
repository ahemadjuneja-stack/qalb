name: Build & Release Qalb APK

# ═══════════════════════════════════════════════════════════════════
#  Qalb CI/CD — "Push to main = naya APK + in-app update"
#
#  Flow:
#    git push origin main
#      → Next.js static export (out/)
#      → Capacitor Android sync
#      → Signed release APK (keystore AUTO-managed — see "Signing" step)
#      → APK upload → Google Cloud Storage (gs://qalb-builds-<project-id>)
#      → Version publish → Firestore appVersions/latest
#      → GitHub Release (APK attach)
#      → Installed apps ko Profile > Check par naya version dikhega
#
#  AUTO-MAGIC (kuch bhi manually banane ki zaroorat nahi):
#    • GCS bucket "qalb-builds-<project-id>" khud ban jata hai + public read
#    • Signing keystore pehli build pe khud generate hoti hai aur private
#      bucket "qalb-keys-<project-id>" me save rehti hai (same signature har build)
#    • Firebase project id service account JSON se auto detect hota hai
#    • versionCode = github.run_number (har push pe +1)
#
#  SIRF 1 SECRET CHAHIYE:
#    GCP_SERVICE_ACCOUNT_JSON = Firebase service account ka JSON (raw paste)
#    (optional: apna keystore dena ho to ANDROID_KEYSTORE_BASE64 + 3 password
#     secrets bhi chalte hain — wo override kar denge auto keystore ko)
# ═══════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: qalb-apk-release
  cancel-in-progress: false

env:
  # GCS bucket jahan APK upload hota hai — runtime pe qalb-builds-<project-id> set hota hai
  NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE_URL }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # gh release create + auto-update publish ke liye write permission chahiye
    permissions:
      contents: write
    steps:
      # ── 1. Checkout + environment ─────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Capacitor 8 ke liye JDK 21 ZAROORI hai (library VERSION_21 target karti hai)
      - name: Setup Java 21 (Android build + keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Capacitor + Android platform
        run: npm i -D @capacitor/cli@latest && npm i @capacitor/android@latest @capacitor/filesystem@latest

      # ── 2. Versioning ─────────────────────────────────────────────
      # versionName = package.json ka "version"
      # versionCode = github.run_number (har push pe automatic +1)
      - name: Resolve version (versionName + auto versionCode)
        id: ver
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Qalb build v$VERSION_NAME (code $VERSION_CODE)"

      # app ka JS updater inhi numbers se compare karta hai
      - name: Generate src/lib/app-build.ts
        run: |
          cat > src/lib/app-build.ts <<EOF
          // AUTO-GENERATED by GitHub Actions — commit mat karna (local default raheta hai)
          export const APP_BUILD = {
            versionCode: ${{ steps.ver.outputs.versionCode }},
            versionName: '${{ steps.ver.outputs.versionName }}',
          } as const
          EOF

      # ── 3. GCP auth (sab se pehle — bucket + keystore isi se chalta hai) ──
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve Firebase project id + bucket names
        run: |
          FPID=$(echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' | jq -r .project_id)
          echo "FPID=$FPID" >> "$GITHUB_ENV"
          echo "GCS_BUCKET=qalb-builds-$FPID" >> "$GITHUB_ENV"
          echo "GCS_KEY_BUCKET=qalb-keys-$FPID" >> "$GITHUB_ENV"
          echo "Firebase project: $FPID"
          echo "APK bucket:       qalb-builds-$FPID (public read)"
          echo "Keys bucket:      qalb-keys-$FPID (private)"

      # Bucket khud ban jata hai — Part C manual nahi karna!
      # NOTE: gcloud storage use karte hain (gsutil mb me -ub jaisa flag tha hi nahi)
      - name: Ensure buckets exist (APK public read + keys private)
        run: |
          set -e
          if [ -z "$FPID" ]; then
            echo "❌ FPID khali hai — 'Resolve Firebase project id' step fail hua tha"
            exit 1
          fi
          if [ -z "$GCS_BUCKET" ]; then
            echo "❌ GCS_BUCKET khali hai"
            exit 1
          fi
          echo "GCP account: $(gcloud config get-value account 2>/dev/null)"
          echo "Project: $FPID | APK bucket: $GCS_BUCKET | Keys bucket: $GCS_KEY_BUCKET"

          create_bucket() {
            local B=$1
            if ! gcloud storage buckets describe "gs://${B}" --project="${FPID}" >/dev/null 2>&1; then
              echo "Bucket ban raha hai: gs://${B}"
              if ! gcloud storage buckets create "gs://${B}" \
                --project="${FPID}" \
                --location=asia-south1 \
                --uniform-bucket-level-access; then
                echo ""
                echo "════════════════════════════════════════════════"
                echo "❌ BUCKET CREATE FAIL — 2 common reasons:"
                echo "  1) PERMISSION: console.cloud.google.com → IAM & Admin → IAM →"
                echo "     firebase-adminsdk@... → pencil → '+ ADD ANOTHER ROLE' →"
                echo "     'Storage Admin' → SAVE → phir Re-run all jobs"
                echo "  2) NAAM CONFLICT: bucket ka naam kisi aur ne le liya hoga"
                echo "════════════════════════════════════════════════"
                exit 1
              fi
            else
              echo "Bucket pehle se hai: gs://${B}"
            fi
          }

          create_bucket "${GCS_BUCKET}"
          # Users APK download kar sakein — public READ only
          gcloud storage buckets add-iam-policy-binding "gs://${GCS_BUCKET}" \
            --member=allUsers --role=roles/storage.objectViewer || true
          # Keystore ke liye private bucket (kisi ko public access NAHI)
          create_bucket "${GCS_KEY_BUCKET}"

      # ── 4. Web build (static export for Capacitor) ────────────────
      - name: Build Next.js static export
        run: |
          # Mobile build me server API routes nahi hote — APK Firestore REST
          # + hosted API (NEXT_PUBLIC_API_BASE) use karta hai. Isliye api/
          # folder temporarily hata ke export lete hain.
          mv src/app/api .api-routes-backup
          MOBILE_BUILD=1 NEXT_PUBLIC_FIREBASE_PROJECT_ID="$FPID" NEXT_PUBLIC_API_BASE="${{ vars.API_BASE_URL }}" npx next build

      # ── 5. Capacitor Android project ──────────────────────────────
      - name: Capacitor sync
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap copy android
          npx cap sync android

      # ── 6. Signing (AUTO-managed keystore) ────────────────────────
      # Priority:
      #   1. Agar aapne ANDROID_KEYSTORE_BASE64 + password secrets diye hain → wahi
      #   2. Warna private GCS bucket se pehle wali keystore download
      #   3. Pehli baar? keytool se nayi keystore + private bucket me backup
      # NOTE: auto mode me keystore file hi asli chaabi hai — private bucket me
      #       save rehti hai, har build same signature deti hai (update install OK).
      - name: Signing setup (auto keystore, secrets override)
        run: |
          mkdir -p android/app
          KS="android/app/qalb-upload.keystore"

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Signing: aapke GitHub secrets wali keystore use ho rahi hai"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KS"
            cat > android/key.properties <<EOF
          storeFile=qalb-upload.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          else
            if gcloud storage cp "gs://${GCS_KEY_BUCKET}/keys/keystore.jks" "$KS" 2>/dev/null; then
              echo "Signing: purani keystore GCS se mili (same signature — updates install honge)"
            else
              echo "Signing: pehli build — nayi keystore generate ho rahi hai..."
              keytool -genkeypair -v \
                -keystore "$KS" \
                -alias qalb \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storetype PKCS12 \
                -storepass qalb-auto-store-2026 \
                -keypass qalb-auto-key-2026 \
                -dname "CN=Qalb App, OU=Qalb, O=Qalb, L=Karachi, C=PK"
              gcloud storage cp "$KS" "gs://${GCS_KEY_BUCKET}/keys/keystore.jks"
              echo "Signing: keystore private bucket me save ho gayi (backup done)"
            fi
            cat > android/key.properties <<EOF
          storeFile=qalb-upload.keystore
          storePassword=qalb-auto-store-2026
          keyAlias=qalb
          keyPassword=qalb-auto-key-2026
          EOF
          fi

      - name: Inject signing config into build.gradle
        run: python3 scripts/patch-android-signing.py

      - name: Set Android versionCode / versionName
        run: |
          BGRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.ver.outputs.versionCode }}/" "$BGRADLE"
          sed -i "s/versionName \".*\"/versionName \"${{ steps.ver.outputs.versionName }}\"/" "$BGRADLE"

      # ── 7. Signed APK build ───────────────────────────────────────
      - name: Gradle assembleRelease
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/qalb-v${{ steps.ver.outputs.versionName }}.apk"
          ls -la dist/

      # ── 8. Upload to Google Cloud Storage ─────────────────────────
      - name: Upload APK to GCS
        run: |
          APK="dist/qalb-v${{ steps.ver.outputs.versionName }}.apk"
          gcloud storage cp "$APK" "gs://${GCS_BUCKET}/releases/latest/qalb-latest.apk"
          gcloud storage cp "$APK" "gs://${GCS_BUCKET}/releases/v${{ steps.ver.outputs.versionName }}/qalb-v${{ steps.ver.outputs.versionName }}.apk"
          # versioned copy bhi rakh te hain — rollback possible
          APK_URL="https://storage.googleapis.com/${GCS_BUCKET}/releases/v${{ steps.ver.outputs.versionName }}/qalb-v${{ steps.ver.outputs.versionName }}.apk"
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"

      # ── 9. Publish version to Firestore (appVersions/latest) ──────
      # App isi doc ko poll karta hai — versionCode bara ho to update prompt.
      - name: Publish to Firestore appVersions/latest
        run: |
          TOKEN=$(gcloud auth print-access-token)
          DOC_URL="https://firestore.googleapis.com/v1/projects/${FPID}/databases/(default)/documents/appVersions/latest?updateMask.fieldPaths=versionCode&updateMask.fieldPaths=versionName&updateMask.fieldPaths=apkUrl&updateMask.fieldPaths=releaseNotes&updateMask.fieldPaths=mandatory&updateMask.fieldPaths=publishedAt"
          RELEASE_NOTES=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }} --jq '.commit.message' | head -1 | cut -c1-500)
          curl -sS -X PATCH "$DOC_URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"fields\": {
                \"versionCode\": {\"integerValue\": \"${{ steps.ver.outputs.versionCode }}\"},
                \"versionName\": {\"stringValue\": \"${{ steps.ver.outputs.versionName }}\"},
                \"apkUrl\":      {\"stringValue\": \"${APK_URL}\"},
                \"releaseNotes\": {\"stringValue\": $(printf '%s' "$RELEASE_NOTES" | jq -Rs .)},
                \"mandatory\":   {\"booleanValue\": false},
                \"publishedAt\": {\"timestampValue\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}
              }
            }" | jq -e '.fields.versionCode.integerValue' >/dev/null \
            && echo "Firestore updated: v${{ steps.ver.outputs.versionName }} (code ${{ steps.ver.outputs.versionCode }})"
        env:
          GH_TOKEN: ${{ github.token }}

      # ── 10. GitHub Release (backup + rollback) ────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.versionName }}-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "Qalb v${{ steps.ver.outputs.versionName }}" \
            --notes "APK build from commit ${{ github.sha }}" \
            "dist/qalb-v${{ steps.ver.outputs.versionName }}.apk" || true
