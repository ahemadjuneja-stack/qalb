# Qalb — CI/CD: Signed Android APK → Google Cloud Storage → Firestore version bump
# Trigger: push to main (ya manual). Keystore + service account GitHub Secrets me rehte hain.
#
# Required GitHub Secrets:
#   ANDROID_KEYSTORE_BASE64   — release keystore ka base64
#   ANDROID_KEYSTORE_PASSWORD — keystore password
#   ANDROID_KEY_ALIAS         — signing key alias
#   ANDROID_KEY_PASSWORD      — key password
#   GCS_SERVICE_ACCOUNT_JSON  — GCS upload ke liye service account (qalb-builds bucket)
#   FIREBASE_SERVICE_ACCOUNT_JSON — Firestore appVersions update ke liye
#   YOUTUBE_API_KEY, GEMINI_API_KEY (optional app config)

name: Qalb Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: qalb-app
  GCS_BUCKET: qalb-builds
  FIRESTORE_COLLECTION: appVersions
  ANDROID_VERSION_CODE: ${{ github.run_number }}
  ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js (static export)
        run: |
          export NEXT_TELEMETRY_DISABLED=1
          bun run build
          # capacitor webDir = out → static export copy
          rm -rf out
          cp -r .next/static out/_next/static 2>/dev/null || true

      - name: Add web assets & sync Capacitor
        run: |
          bunx cap add android || true
          bunx cap sync android

      - name: Bump Android versionName/versionCode
        run: |
          cd android/app
          sed -i "s/versionCode .*/versionCode $ANDROID_VERSION_CODE/" build.gradle
          sed -i "s/versionName \".*\"/versionName \"$ANDROID_VERSION_NAME\"/" build.gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/qalb-release.jks

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/qalb-release.jks \
            -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD

      - name: Rename APK artifact
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" qalb-v${{ env.ANDROID_VERSION_NAME }}.apk

      - name: Authenticate to Google Cloud (GCS)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCS_SERVICE_ACCOUNT_JSON }}

      - name: Upload APK to Google Cloud Storage
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: qalb-v${{ env.ANDROID_VERSION_NAME }}.apk
          destination: ${{ env.GCS_BUCKET }}/releases
          parent: false

      - name: Update Firestore appVersions (latest release URL)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          cat > sa.json <<< "$FIREBASE_SA"
          node - <<'EOF'
          const admin = require('firebase-admin')
          const fs = require('fs')
          admin.initializeApp({ credential: admin.credential.cert(JSON.parse(fs.readFileSync('sa.json','utf8'))) })
          const db = admin.firestore()
          db.collection('appVersions').doc('latest').set({
            versionCode: parseInt(process.env.ANDROID_VERSION_CODE, 10),
            versionName: process.env.ANDROID_VERSION_NAME,
            apkUrl: `https://storage.googleapis.com/${process.env.GCS_BUCKET}/releases/qalb-v${process.env.ANDROID_VERSION_NAME}.apk`,
            releaseNotes: `Automated release ${process.env.ANDROID_VERSION_NAME}`,
            mandatory: false,
            publishedAt: admin.firestore.FieldValue.serverTimestamp(),
          }, { merge: true }).then(() => { console.log('Firestore updated'); process.exit(0) }).catch((e) => { console.error(e); process.exit(1) })
          EOF

      - name: Upload artifact (GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: qalb-apk
          path: qalb-v${{ env.ANDROID_VERSION_NAME }}.apk
